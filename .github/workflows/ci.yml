name: CI                         # the label shown in GitHub's Actions tab

on:                              # when should this run?
  push:
    branches: [main]             # every time someone pushes directly to main
  pull_request:                  # and every time a pull request is opened or updated

jobs:                            # a workflow is made of jobs; we only need one
  test:                          # the job's name (any label works)
    runs-on: ubuntu-latest       # GitHub lends you a fresh Linux machine for the run, then throws it away
    defaults:
      run:
        working-directory: backend   # every "run:" step below executes inside the backend folder

    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:                    # a throwaway Postgres for the database tests, same version as docker-compose.yml
        image: postgres:17
        env:                       # matches the default DATABASE_URL in config.py, so no extra settings are needed
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader -d trading"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:                       # the job's to-do list, executed top to bottom
      - uses: actions/checkout@v4    # download your repo's code onto the blank machine (it starts empty)

      - uses: actions/setup-python@v5    # install Python on the machine
        with:
          python-version: "3.12"         # use the same version you run locally (check with: python --version)
          cache: pip                     # save downloaded packages between runs, so later runs are faster
          cache-dependency-path: backend/requirements.txt   # the cache refreshes whenever this file changes

      - run: pip install -r requirements.txt   # install everything listed in the file (-r means "read from this file")

      - run: pytest                  # run your tests; if any fail, the whole job goes red